# user www-data;
worker_processes 4;
worker_rlimit_nofile 16384;
# pid /var/run/nginx.pid;

events {
	worker_connections 16384;
	multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	types_hash_max_size 2048;
	server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# Logging Settings
	##

	# access_log syslog:server=unix:/dev/log,nohostname,tag=nginx,severity=info;
	# error_log syslog:server=unix:/dev/log,nohostname,tag=nginx,severity=crit;

	##
	# Gzip Settings
	##

	gzip on;
	gzip_disable "msie6";

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##




limit_req_zone $binary_remote_addr zone=api_dashboads_db:32m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_search:32m rate=20r/m;

map $http_host $upstream {
    # ~*grafana-dev grafana-dev-upstream;
    # ~*grafana-pre grafana-pre-upstream;
    default       grafana-upstream;
}
