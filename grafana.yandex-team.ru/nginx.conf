# }

# TODO: remove
upstream grafana-upstream {
    server host.docker.internal:8080;
} 


map $http_host $alarm_machine {
    # ~*grafana-pre '';
    default '
    <div id="alarm_corner" style="position:absolute;top:0;right:0;border:0px solid;width:15px;height:15px;background-image:linear-gradient(225deg,red, red 10px,transparent 10px,transparent);z-index:2000;display:none;">
    	<div style="cursor:pointer;position:absolute;top:0;right:0;width:10px;height:10px;" onclick="onAlarmCornerClick();"></div>
    </div>
    <div id="alarm_message" style="pointer-events:all;position:absolute;top:0;bottom:0;left:0;right:0;background:rgba(0,0,0,0.5);z-index:2000;display:none;">
        <div style="margin:40px auto;padding:10px;text-align:center;color:#911;background:#322;border:0px solid;border-radius:3px;max-width:max-content;position:relative;">
            <b style="cursor:pointer;position:absolute;top:5px;right:10px;color:#911;" onmouseover="this.style.color=\'#f44\'" onmouseout="this.style.color=\'#911\'" onclick="onAlarmMessageClose();">×</b>
            <div id="alarm_body" style="margin-right:80px;margin-left:80px;">
            </div>
        </div>
    </div>
    <script>
    var alarmIdUrl="/alarm/id";
    var alarmBodyUrl="/alarm/body";
    var alarmId="";
    var alarmMessage=document.getElementById("alarm_message");
    var alarmBody=document.getElementById("alarm_body");
    var alarmCorner=document.getElementById("alarm_corner");
    var topWindow=window==top;
    const updateIntervalMs=60*1000;
    const hideTimeoutMs=36000*1000;
    function fetchData(url,onLoad){var request=new XMLHttpRequest();request.open("GET",url);request.responseType="text";request.onload=function(){onLoad(request.status==200?request.responseText:null)};request.send()}
    function setCookie(name,value){document.cookie=name+"="+value+"; Path=/; SameSite=Strict;"}
    function getCookie(name){var idx=document.cookie.indexOf(name+"=");if(idx<0)return null;name=document.cookie.substring(idx+name.length+1);idx=name.indexOf(";");return(idx<0)?name:name.substring(0,idx)}
    function showMessage(){alarmCorner.style.display="none";alarmMessage.style.display=null}
    function showCorner(){alarmMessage.style.display="none";alarmCorner.style.display=null}
    function hideAll(){alarmCorner.style.display="none";alarmMessage.style.display="none"}
    function isMessage(){return!alarmMessage.style.display}
    function onAlarmCornerClick(){getAndShowBody()}
    function onAlarmMessageClose(){setCookie("alarmIdSeen",alarmId);showCorner()}
    function getAndShowBody(){fetchData(alarmBodyUrl,function(newAlarmBody){if(newAlarmBody){alarmBody.innerHTML=newAlarmBody.replace("{URI}",window.location.pathname+window.location.search+window.location.hash);showMessage();setTimeout(showCorner,hideTimeoutMs)}})}
    function checkAlarm(){fetchData(alarmIdUrl,function(newAlarmId){if(newAlarmId==="")hideAll();else if(newAlarmId&&newAlarmId!=alarmId){alarmId=newAlarmId;if((topWindow&&alarmId!=getCookie("alarmIdSeen"))||(!topWindow&&isMessage()))getAndShowBody();else showCorner()}})}
    checkAlarm();setInterval(checkAlarm,updateIntervalMs);
    </script>';
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}


client_header_buffer_size   32k;
large_client_header_buffers 4 32k;

client_max_body_size        10m;
client_body_buffer_size     128k;
client_body_temp_path       /dev/shm/nginx 1;

proxy_buffer_size           128k;
proxy_buffers               16 128k;
proxy_busy_buffers_size     256k;
proxy_temp_file_write_size  256k;


##
##  Timeouts
##
keepalive_timeout       65s;    # keeping keep-alive client connection open on the server side (75s)
client_body_timeout     60s;    # reading client request body (60s)
client_header_timeout   60s;    # reading client request header (60s)
send_timeout            60s;    # transmitting a response to the client (60s)
                                # between two successive write operations, not for the transmission of the whole response 
proxy_next_upstream         error timeout invalid_header;
proxy_next_upstream_timeout 120s;   # time during which a request can be passed to the next server (0 value turns off this limitation)
proxy_connect_timeout       5s;     # establishing a connection with a proxied server (60s)
proxy_read_timeout          120s;   # reading a response from the proxied server (60s)
proxy_send_timeout          40s;    # transmitting a request to the proxied server (60s)


