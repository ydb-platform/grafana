server {
    listen          80 default;
    # listen          [::]:80 default;
    http2           on;
    # server_name     grafana.yandex-team.ru graf.yandex-team.ru grafana-http.search.yandex.net grafana-pre.yandex-team.ru grafana-dev.yandex-team.ru;
    # resolver        [::1];

    # ssl_certificate     /etc/nginx/ssl/grafana_cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/grafana_key.pem;

    # ssl_prefer_server_ciphers   on;
    # ssl_protocols               TLSv1.1 TLSv1.2;
    # ssl_ciphers                 kEECDH+AESGCM+AES128:kEECDH+AES128:kRSA+AESGCM+AES128:kRSA+AES128:DES-CBC3-SHA:!RC4:!aNULL:!eNULL:!MD5:!EXPORT:!LOW:!SEED:!CAMELLIA:!IDEA:!PSK:!SRP:!SSLv2;
    # ssl_session_cache           shared:SSL:64m;
    # ssl_session_timeout         28h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";
    add_header X-Backend "$hostname";
    add_header X-Service-Backend "$upstream_addr";

    set $passport https://passport.yandex-team.ru/auth?retpath=https://$http_host$uri;

    location =/proxy.html {
        return 200 "$hostname";
    }

    location =/balancer-ping {
        proxy_pass      http://$upstream/api/health;
        proxy_redirect  off;
    }

    location = /basic_status {
        stub_status;
    }

    # location /authdir {
    #     internal;

    #     auth_request_set $YandexTeamLogin $upstream_http_Burne_Yandex_Login;

    #     proxy_pass                          http://auth-upstream;
    #     proxy_set_header Host               $http_host;
    #     proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto  $scheme;
    #     proxy_set_header X-Real-IP          $remote_addr;
    #     proxy_set_header X-Retpath          $http_host;
    #     proxy_set_header Content-Length     "";
    #     proxy_set_header X-Auth-All         "";
    # }

    set $YandexTeamLogin 'zkpo';

    location /api {
        # auth_request                        /authdir;
        # auth_request_set $DeniedReason      $upstream_http_DeniedReason;
        # auth_request_set $YandexTeamLogin   $upstream_http_Burne_Yandex_Login;

        proxy_pass                          http://$upstream;
        proxy_set_header Host               $host;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Retpath          $http_host;
        proxy_set_header Authorization      "";
        proxy_set_header X-Yandex-Login     $YandexTeamLogin;
        proxy_set_header X-Forwarded-User   $YandexTeamLogin;

        add_header Access-Control-Allow-Origin  "*";
        add_header Access-Control-Allow-Methods "GET";

        location /api/dashboards/db {
            # IN CASE OF EMERGENCY UNCOMMENT THIS LIMIT
            # limit_req zone=api_dashboads_db burst=20;
            proxy_pass            http://$upstream;
        }

        location /api/search {
            # IN CASE OF EMERGENCY UNCOMMENT THIS LIMIT
            # limit_req zone=api_search burst=30 nodelay;
            proxy_pass            http://$upstream;
        }
    }

    # location /dashboard/db/ {
    #     proxy_pass http://[::1]:8090;
    # }

    location =/alarm/id {
        return 200 "";
    }
    location =/alarm/body {
        set $alarm_version  '10.1.5';
        set $alarm_deadline '28 ноября';
        set $alarm_ticket   'GRAFANA-292';

        return 200 '<b>$alarm_deadline</b> планируется обновление Grafana на версию <b>$alarm_version</b>.<br>
            Проверьте работу ваших дашбордов на <a href="https://grafana-pre.yandex-team.ru{URI}" target="_blank" style="color:#3be;text-decoration:underline;">pre-версии</a>.
            Подробности в <a href="https://st.yandex-team.ru/$alarm_ticket" target="_blank" style="color:#3be;text-decoration:underline;">$alarm_ticket</a>.';
    }

    location / {
        # set $grafana_metrika_counter '<script type="text/javascript"> (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})(window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");var counterId = 44738830;ym(counterId, "init", {clickmap:true,trackLinks:true,accurateTrackBounce:true,webvisor:false,trackHash:true});var match = /yandex_login=(.*?);/.exec(document.cookie);var login = match?match[1] : "unknown-user";var isRobot = login.startsWith("robot-") || login === "unknown-user";var isZombie = login.startsWith("zomb-");var isHuman = !isRobot && !isZombie;var params = { isRobot: isRobot, isZombie: isZombie, isHuman: isHuman, UserID: login };ym(counterId, "setUserID", login);ym(counterId, "params", params);ym(counterId, "userParams", params); </script> <noscript><div><img src="https://mc.yandex.ru/watch/44738830" style="position:absolute; left:-9999px;" alt="" /></div></noscript>';
        

        # if ( $cookie_sessionid2 = "" ) {
        #     return 302 $passport;
        # }

        # auth_request                        /authdir;
        # auth_request_set $DeniedReason      $upstream_http_DeniedReason;
        # auth_request_set $YandexTeamLogin   $upstream_http_Burne_Yandex_Login;

        proxy_pass                          http://$upstream;
        proxy_set_header Host               $host;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Retpath          $http_host;
        proxy_set_header Authorization      "";
        proxy_set_header X-Yandex-Login     $YandexTeamLogin;
        proxy_set_header X-Forwarded-User   $YandexTeamLogin;

        # sub_filter  '</head>'   '$grafana_metrika_counter</head>';
        sub_filter  '</body>'   '$alarm_machine</body>';
    }

    set $error_css '<style type="text/css">
        html {height:100%;margin:10px;}
        body {height:100%;margin:10px;font-family:Calibri,Verdana,Arial,Helvetica;color:#d8d9da;background-color:#141414;}
        h1 {font-size:20px;}
        a {color:#d8d9da;text-decoration:none;font-weight:bold}
        a:hover {color:#d8d9da;text-decoration:underline;font-weight:bold}
    </style>';

    # location =/error/401.html {
    #     return 302  $passport;
    # }

    location =/error/403.html {
        add_header Cache-Control "no-cache, no-store";
        internal;
        return 200  '<html><head><meta http-equiv="refresh" content="2"/></head>$error_css
            <body><h1>Preparing a dashboard for you...</h1><br>
            If you see this page (403) for too long, please authorize yourself <a href="$passport">here</a>!</body>
        </html>';
    }

    location =/error/404.html {
        return 200  '<html>$error_css<body><h1>Error 404: Page not found</h1></body></html>';
    }

    location =/error/502.html {
        add_header Cache-Control "no-cache, no-store";
        internal;
        return 200  '<html><head><meta http-equiv="refresh" content="2"/></head>$error_css
            <body><h1>Error 502: Backends are broken</h1><br>Backend at $host is broken.</body>
        </html>';
    }

    location =/error/5xx.html {
        add_header Cache-Control "no-cache, no-store";
        internal;
        return 200  '<html><head><meta http-equiv="refresh" content="2"/></head>$error_css
            <body><h1>Error 5XX happened: something bad happened with backends</h1><br>Probably, $host backend is too slow, or is failing.</body>
        </html>';
    }

    error_page 401 /error/401.html;
    error_page 403 /error/403.html;
    error_page 404 /error/404.html;
    error_page 502 /error/502.html;
    error_page 500 503 504 /error/5xx.html;
}
	
}





